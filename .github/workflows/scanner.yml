name: Runner Scanner

# Runs entirely on GitHub's servers — no Mac, no app, nothing to keep awake.
# Every 15 minutes through pre-market and the trading day, plus one evening
# pass that scores the day's catches. (GitHub cron is UTC; the script itself
# checks Eastern Time and skips detection outside 4:00am-4:10pm ET.)
on:
  schedule:
    - cron: "*/15 8-21 * * 1-5"   # ~4:00am-5:45pm ET during summer time
    - cron: "15 22 * * 1-5"       # evening scoring pass
  workflow_dispatch: {}            # run-by-hand button on the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  scan-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Scan the market
        run: python scanner.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
