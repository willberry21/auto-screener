name: Auto Screener

# Runs entirely on GitHub's servers — no Mac, no app, nothing to keep awake.
on:
  schedule:
    - cron: "0 21 * * 1-5"   # 21:00 UTC = ~2pm PT / 5pm ET, weekdays, after the close
  workflow_dispatch: {}       # also lets you run it by hand from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the dashboard
        run: python engine.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
